name: Import job postings

on:
  workflow_dispatch:
  schedule:
    # 1:15 PM UTC each day
    - cron: "15 13 * * *"

permissions:
  contents: read

jobs:
  import-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import jobs into Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          SOURCE_API_KEY: ${{ secrets.SOURCE_API_KEY }}
        run: python src/import_jobs.py